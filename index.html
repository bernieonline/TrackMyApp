<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyBGAccounts</title>
  <link rel="stylesheet" href="css/styles.css?v=2">
</head>
<body>

  <header class="app-header">
    <div class="app-brand">TrackMyApp</div>
    <h1>Savings and Investments</h1>
    <div class="header-right">
      <span id="user-display" class="user-display"></span>
      <button id="btn-signin" class="btn-primary" type="button">Sign In</button>
      <button id="btn-signout" class="btn-edit" type="button" hidden>Sign Out</button>
      <span id="lock-indicator" class="lock-indicator locked">Locked</span>
      <button id="btn-passphrase" class="btn-edit" type="button">Passphrase</button>
    </div>
  </header>

  <!-- View toggle -->
  <div class="view-toggle">
    <button id="btn-view-entry" class="view-tab active" type="button">Entry</button>
    <button id="btn-view-review" class="view-tab" type="button">Review</button>
    <button id="btn-view-reports" class="view-tab" type="button">Reports</button>
    <span class="controls-spacer"></span>
    <button id="btn-save" class="btn-primary" type="button">Save</button>
    <button id="btn-export" class="btn-edit" type="button">Export</button>
  </div>

  <!-- ═══ ENTRY VIEW ═══ -->
  <div id="entry-view">
    <!-- Controls: month/year selectors + action buttons -->
    <div class="controls">
      <label for="month-select">Month</label>
      <select id="month-select"></select>

      <label for="year-select">Year</label>
      <select id="year-select"></select>

      <span class="controls-spacer"></span>

      <button id="btn-edit" class="btn-edit" type="button">Edit</button>
      <button id="btn-add" class="btn-primary" type="button">Add Provider</button>
    </div>

    <!-- Provider table -->
    <div class="provider-table-wrapper">
      <table class="provider-table">
        <thead id="provider-thead"></thead>
        <tbody id="provider-tbody"></tbody>
      </table>
    </div>

    <!-- Totals section -->
    <div id="totals-section" class="totals-section"></div>

    <!-- Comments -->
    <div class="comments-section">
      <label for="comment-box">Comments</label>
      <textarea id="comment-box" class="comment-box" rows="3" placeholder="Notes for this month…"></textarea>
    </div>
  </div>

  <!-- ═══ REVIEW VIEW ═══ -->
  <div id="review-view" hidden>
    <!-- Month navigation -->
    <div class="review-nav">
      <button id="btn-prev-month" class="btn-edit" type="button">&larr; Prev</button>
      <span id="review-month-label" class="review-month-label">—</span>
      <button id="btn-next-month" class="btn-edit" type="button">Next &rarr;</button>
    </div>

    <!-- Read-only provider table -->
    <div class="provider-table-wrapper">
      <table class="provider-table">
        <thead>
          <tr><th>Provider</th><th style="text-align:right">Value</th><th style="width:40px"></th></tr>
        </thead>
        <tbody id="review-tbody"></tbody>
      </table>
    </div>

    <!-- Review totals -->
    <div id="review-totals" class="totals-section"></div>

    <!-- Review comment -->
    <div class="comments-section" hidden>
      <label>Comments</label>
      <p id="review-comment" class="review-comment"></p>
    </div>

    <!-- 3-month summary -->
    <div class="summary-section">
      <h3>3-Month Summary</h3>
      <div class="summary-table-wrapper">
        <table id="summary-table" class="summary-table"></table>
      </div>
    </div>

    <!-- Spreadsheet button -->
    <div class="spreadsheet-controls">
      <button id="btn-spreadsheet" class="btn-primary" type="button">Spreadsheet View</button>
      <button id="btn-close-spreadsheet" class="btn-edit" type="button" hidden>Close Spreadsheet</button>
    </div>

    <!-- Spreadsheet / pivot table -->
    <div id="spreadsheet-section" class="spreadsheet-section" hidden>
      <div class="spreadsheet-wrapper">
        <table id="spreadsheet-table" class="spreadsheet-table"></table>
      </div>
    </div>
  </div>

  <!-- ═══ REPORTS VIEW ═══ -->
  <div id="reports-view" hidden>
    <!-- Row selector + date range controls -->
    <div class="reports-controls">
      <label for="reports-row-select">Show</label>
      <select id="reports-row-select"></select>
    </div>

    <!-- Date range -->
    <div class="reports-range">
      <button class="range-btn" data-range="3" type="button">3m</button>
      <button class="range-btn" data-range="6" type="button">6m</button>
      <button class="range-btn active" data-range="12" type="button">12m</button>
      <button class="range-btn" data-range="custom" type="button">Custom</button>
      <div id="custom-range-fields" class="custom-range-fields" hidden>
        <select id="range-start-month"></select>
        <select id="range-start-year"></select>
        <span>to</span>
        <select id="range-end-month"></select>
        <select id="range-end-year"></select>
      </div>
    </div>

    <!-- Growth rate callout + adjusted toggle -->
    <div class="growth-row">
      <div id="growth-rate-callout" class="growth-callout"></div>
      <button id="btn-adjusted" class="adjusted-btn" type="button" hidden>Show adjusted</button>
    </div>

    <!-- Trend chart -->
    <div class="chart-container">
      <canvas id="trend-chart"></canvas>
    </div>

    <!-- Moving average controls -->
    <div class="ma-controls">
      <span>Moving avg:</span>
      <button class="ma-btn active" data-ma="3" type="button">3m</button>
      <button class="ma-btn" data-ma="6" type="button">6m</button>
      <button class="ma-btn" data-ma="12" type="button">12m</button>
    </div>

    <!-- Pie charts -->
    <div class="pie-section">
      <div class="pie-row">
        <div class="chart-container-half">
          <h3>Category Allocation</h3>
          <div class="pie-month-select-wrapper">
            <label for="pie-month-select">Month</label>
            <select id="pie-month-select"></select>
          </div>
          <canvas id="allocation-pie"></canvas>
        </div>
        <div class="chart-container-half">
          <h3>Provider Breakdown</h3>
          <canvas id="savings-pie"></canvas>
          <canvas id="investments-pie"></canvas>
        </div>
      </div>
    </div>

    <!-- Allocation drift -->
    <div class="chart-container">
      <h3>Allocation Over Time</h3>
      <canvas id="allocation-drift-chart"></canvas>
    </div>

    <!-- Best/worst provider -->
    <div id="best-worst-callout" class="best-worst-callout"></div>

    <!-- FTSE comparison -->
    <div id="ftse-comparison" class="ftse-comparison"></div>
  </div>

  <!-- Add provider dialog -->
  <div id="add-dialog" class="dialog-overlay">
    <div class="dialog">
      <h2>Add Provider</h2>
      <form id="add-form">
        <div class="form-group">
          <label for="add-label">Provider Name</label>
          <input type="text" id="add-label" required placeholder="e.g. Barclays ISA">
        </div>
        <div class="form-group">
          <label for="add-category">Category</label>
          <select id="add-category">
            <option value="Saving">Saving</option>
            <option value="Investment">Investment</option>
            <option value="Pension">Pension</option>
            <option value="Index">Index</option>
          </select>
        </div>
        <div class="dialog-buttons">
          <button type="button" id="btn-add-cancel" class="btn-edit">Cancel</button>
          <button type="submit" class="btn-primary">Add</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Passphrase dialog -->
  <div id="passphrase-dialog" class="dialog-overlay">
    <div class="dialog">
      <h2 id="passphrase-title">Enter Passphrase</h2>
      <form id="passphrase-form">
        <div id="passphrase-old-group" class="form-group" hidden>
          <label for="passphrase-old">Current Passphrase</label>
          <input type="password" id="passphrase-old" autocomplete="off">
        </div>
        <div id="passphrase-new-group" class="form-group">
          <label for="passphrase-new">Passphrase</label>
          <input type="password" id="passphrase-new" autocomplete="off">
        </div>
        <div id="passphrase-confirm-group" class="form-group" hidden>
          <label for="passphrase-confirm">Confirm Passphrase</label>
          <input type="password" id="passphrase-confirm" autocomplete="off">
        </div>
        <p id="passphrase-error" class="passphrase-error" hidden></p>
        <div class="dialog-buttons">
          <button type="button" id="btn-passphrase-cancel" class="btn-edit">Cancel</button>
          <button type="submit" class="btn-primary">Submit</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Status overlay (loading/saving feedback) -->
  <div id="status-overlay" class="status-overlay" hidden>
    <div class="status-message" id="status-message">Loading...</div>
  </div>

  <script src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="js/providers.js?v=2"></script>
  <script src="js/data.js?v=2"></script>
  <script src="js/storage.js?v=2"></script>
  <script src="js/crypto.js?v=2"></script>
  <script src="js/crypto-ui.js?v=2"></script>
  <script src="js/onedrive.js?v=2"></script>
  <script src="js/review.js?v=2"></script>
  <script src="js/charts.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
